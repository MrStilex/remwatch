services:

  vector:
    image: timberio/vector:0.40.0-alpine
    container_name: remwatch-vector-panel
    restart: unless-stopped
    user: root
    environment:
      LOKI_URL: "${LOKI_URL}"
      PANEL_NAME: "${PANEL_NAME}"
      NODE_IP: "${NODE_IP}"
      COUNTRY: "${COUNTRY}"
    volumes:
      - ./vector/vector-panel.yaml:/etc/vector/vector.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: ["--config", "/etc/vector/vector.yaml"]
    networks:
      - remwatch

  node-exporter:
    image: prom/node-exporter:latest
    container_name: remwatch-node-exporter
    restart: unless-stopped
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    ports:
      - "9100:9100"
    networks:
      - remwatch

networks:
  remwatch:
    driver: bridge
