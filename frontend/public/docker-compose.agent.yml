services:

  vector:
    image: timberio/vector:0.40.0-alpine
    container_name: remwatch-vector
    restart: unless-stopped
    environment:
      LOKI_URL: "${LOKI_URL}"
      NODE_NAME: "${NODE_NAME}"
      NODE_IP: "${NODE_IP}"
      COUNTRY: "${COUNTRY}"
      ENVIRONMENT: "${ENVIRONMENT:-production}"
    volumes:
      - ./vector/vector.yaml:/etc/vector/vector.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command: ["--config", "/etc/vector/vector.yaml"]
    networks:
      - remwatch

  node-exporter:
    image: prom/node-exporter:latest
    container_name: remwatch-node-exporter
    restart: unless-stopped
    profiles: ["with-exporter"]
    pid: host
    network_mode: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--web.listen-address=:9100'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'

networks:
  remwatch:
    driver: bridge
